<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirGPT — Local-first AI, governed by Netie</title>
<meta name="description" content="AirGPT keeps engineering work on the laptop, syncs safely from your phone, and gives your team one audited path to AI. A Netie product.">
<style>
  :root, .sw-root{
    --sw-bg:#050505;
    --sw-ink:#e5e5e5;
    --sw-ink-soft:#888888;
    --sw-accent:#4FE3C1;
    --sw-font-display:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --sw-font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  html,body{margin:0;background:#050505;overflow-x:hidden;}
  .sw-nav{background:color-mix(in srgb,#111111 72%,transparent);border-color:#333;}
  .sw-nav__item.is-active{color:#050505;}
  .sw-topcta{color:#050505;background:var(--sw-accent);}
  .sw-btn--primary{color:#050505;background:var(--sw-accent);}
  .sw-btn--ghost{color:var(--sw-ink);border-color:#333;}
  .sw-copy__tags li{color:color-mix(in srgb,var(--sw-accent) 80%,#fff);background:color-mix(in srgb,var(--sw-accent) 12%,#0a0a0a);border-color:color-mix(in srgb,var(--sw-accent) 35%,transparent);}
  .sw-route__label{color:var(--sw-ink);background:color-mix(in srgb,#111111 85%,transparent);border-color:#333;}
  .sw-brand__name{letter-spacing:.02em;}
</style>
</head>
<body class="sw-standalone">
<div id="world"></div>
<script src="scroll-world.js"></script>
<script>
