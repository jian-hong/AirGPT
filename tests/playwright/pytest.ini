[pytest]
; AirGPT "sense and feel" Playwright stress/debug suite.
; Run from repo root:
;   python -m pytest tests/playwright --browser chromium --screenshot only-on-failure --video retain-on-failure --output video-assets/03-demo-clips/_debug
base_url = http://127.0.0.1:8765
testpaths = .
addopts = -ra --strict-markers
markers =
    slow: test hits the real server harder / takes longer
    ai: test may exercise the AI streaming endpoint (kept to a minimum, never looped)
